<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REALDRIVE · Physics Smoke Test</title>
  <style>
    :root { color-scheme: dark; font-family: Consolas, monospace; background: #101820; color: #edf3f5; }
    body { margin: 0; padding: 32px; }
    main { max-width: 680px; margin: 0 auto; }
    h1 { color: #68e0c1; font-size: 20px; }
    #status { padding: 14px; border: 1px solid #52656b; border-radius: 4px; }
    #status[data-result="pass"] { border-color: #68e0c1; }
    #status[data-result="fail"] { border-color: #ff7368; color: #ffaaa2; }
    pre { color: #b7c6cc; white-space: pre-wrap; }
  </style>
</head>
<body>
  <main>
    <h1>REALDRIVE · PRUEBA DE FÍSICA</h1>
    <p id="status" data-result="running">Ejecutando aceleración, suspensión, dirección y frenado…</p>
    <pre id="details"></pre>
  </main>
  <script type="module">
    import { runPhysicsSmoke } from '/src/physics/physics.smoke.ts';

    const status = document.querySelector('#status');
    const details = document.querySelector('#details');
    try {
      const result = await runPhysicsSmoke();
      status.dataset.result = 'pass';
      status.textContent = 'APROBADA';
      details.textContent = JSON.stringify(result, null, 2);
    } catch (error) {
      status.dataset.result = 'fail';
      status.textContent = 'FALLÓ';
      details.textContent = error instanceof Error ? error.message : String(error);
      throw error;
    }
  </script>
</body>
</html>
